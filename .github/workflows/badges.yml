name: update-badges

permissions:
  contents: write  
  issues: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            github::r-lib/gh
            any::jsonlite

      - name: Make svgs
        run: Rscript "update_badges.R"

      - name: Check pkg names in registry
        run: Rscript "check-registry.R"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.4.3
        with:
          branch: gh-pages
          folder: pkgsvgs
          git-config-name: ropenscibot
          git-config-email: accounts+ropenscibot@ropensci.org

      - name: Notify on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          WFURL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment 18 --repo "${{ github.repository }}" \
            -b "@ropensci-org/admin The dashboard workflow has failed at $WFURL."
